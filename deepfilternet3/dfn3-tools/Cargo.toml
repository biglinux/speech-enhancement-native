[package]
name = "dfn3-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line denoiser and benchmark for the DeepFilterNet3 engines"
publish.workspace = true

# Developer CLIs, one per engine: each plugin rlib exports `ladspa_descriptor`, so
# one binary cannot link both.
[dependencies]
dfn3-plugin = { path = "../dfn3-plugin" }
dfn3-ladspa = { path = "../dfn3-ladspa" }
dfn3ll-ladspa = { path = "../dfn3ll-ladspa" }

[lints]
workspace = true

# Standalone crate (excluded from the parent workspace): cargo-fuzz needs a
# nightly toolchain, while the plugin gate is pinned to stable 1.98.1.
[package]
name = "dfn3ll-ladspa-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# The fuzz target is shared between the plugins and names its plugin `plugin`.
plugin = { package = "dfn3ll-ladspa", path = ".." }

[[bin]]
name = "run"
path = "../../dfn3-plugin/fuzz/run.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[workspace]

[package]
name = "dfn3-ladspa"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Independent Rust reimplementation of DeepFilterNet3 streaming inference — light int8 LADSPA mono denoiser"
publish = false # cdylib LADSPA plugin, built to .so; never published to crates.io

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dfn-ops = { path = "../../ops" }
dfn3-plugin = { path = "../dfn3-plugin" }

[dev-dependencies]
silero-vad = { path = "../../silero-vad" }

[features]
# Diagnostics: cap the SIMD tier the project kernels select at run time, to
# compare tiers on one machine. Never enabled by a package build.
force-sse41 = ["dfn-ops/force-sse41"]
force-avx1 = ["dfn-ops/force-avx1"]

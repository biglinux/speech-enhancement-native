[package]
name = "dfn3-ladspa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DeepFilterNet3 LADSPA mono denoiser"
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ops = { path = "../../ops" }
dfn3-plugin = { path = "../dfn3-plugin" }

[dev-dependencies]
silero-vad = { path = "../../silero-vad" }

[features]
# Diagnostics: cap the SIMD tier the project kernels select at run time, to
# compare tiers on one machine. Never enabled by a package build.
force-sse41 = ["ops/force-sse41"]
force-avx1 = ["ops/force-avx1"]

[lints]
workspace = true

[package]
name = "dfn-tools"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Developer CLIs, one per engine: each plugin rlib exports `ladspa_descriptor`, so
# one binary cannot link both.
[dependencies]
dfn3-plugin = { path = "../dfn3-plugin" }
dfn3-ladspa = { path = "../dfn3-ladspa" }
dfn3ll-ladspa = { path = "../dfn3ll-ladspa" }

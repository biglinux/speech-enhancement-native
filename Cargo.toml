[workspace]
members = [
    "ops",
    "deepfilternet3/dfn3-ladspa",
    "deepfilternet3/dfn3ll-ladspa",
    "deepfilternet3/tools",
    "limiter-ladspa",
    "dpdfnet",
    "dpdfnet/ops",
    "gtcrn-aec/aec-gtcrn",
    "gtcrn-aec/spa-aec-gtcrn",
]
exclude = ["deepfilternet3/dfn3-ladspa/fuzz", "deepfilternet3/dfn3ll-ladspa/fuzz"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding costs the GTCRN-AEC streaming path 37% on a Sandy Bridge i3.
panic = "abort"

# DPDFNet catches initialization panics at the C ABI and reports a failed
# instantiate instead of taking the host down, which needs unwinding.
# Build it with `--profile release-unwind -p dpdfnet-native`.
[profile.release-unwind]
inherits = "release"
panic = "unwind"

# cargo-deny — policy: advisories (CVEs), licenses, bans, sources.
# Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
# This project is MIT OR Apache-2.0 (permissive). Dependencies must be
# permissive-compatible: no GPL/other whole-work copyleft, which would force the
# combined work under those terms. MPL-2.0 is file-level copyleft and is fine.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # internal workspace path-deps; not published to crates.io
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

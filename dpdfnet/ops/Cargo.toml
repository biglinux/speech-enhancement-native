[package]
name = "dpdfnet-ops"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "f32 SIMD kernels and activation quantization of the DPDFNet engine"
publish = false

[features]
# Diagnostics: cap the SIMD tier the project kernels select at run time, to
# compare tiers on one machine. Never enabled by a package build.
force-sse41 = []
force-avx1 = []

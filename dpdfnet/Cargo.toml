[package]
name = "dpdfnet-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DPDFNet-2 48 kHz HR engine, LADSPA plugin and whole-file enhancer"
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
ops = { path = "../ops" }
libc = "0.2"
realfft = "3.5"
serde_json = "1"
sha2 = "0.10"

[features]
# Diagnostics: cap the SIMD tier the project kernels select at run time, to
# compare tiers on one machine. Never enabled by a package build.
force-sse41 = ["ops/force-sse41"]
force-avx1 = ["ops/force-avx1"]

[lints]
workspace = true

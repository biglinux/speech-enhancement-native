[package]
name = "ops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "int8/SIMD kernels and resamplers shared by every engine"
publish.workspace = true

[dependencies]
libc = "0.2"

[features]
# Diagnostics: cap the SIMD tier the project kernels select at run time, to
# compare tiers on one machine. Never enabled by a package build.
force-sse41 = []
force-avx1 = []

[lints]
workspace = true

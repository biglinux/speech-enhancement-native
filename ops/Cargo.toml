[package]
name = "dfn-ops"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "int8/SIMD kernels and resamplers shared by the DeepFilterNet3, GTCRN-AEC and Silero engines"
publish = false

[dependencies]
libc = "0.2"

[features]
# Diagnostics: cap the SIMD tier the project kernels select at run time, to
# compare tiers on one machine. Never enabled by a package build.
force-sse41 = []
force-avx1 = []
